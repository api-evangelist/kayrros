aid: kayrros
name: Kayrros
description: >-
  Kayrros is an environmental-intelligence and geospatial-AI company that
  independently tracks human activity and its physical footprint worldwide by
  combining satellite imagery, alternative data, and machine learning. Its
  products span energy markets — crude oil and jet fuel intelligence, LNG,
  renewables, solar and battery-storage construction monitoring, industrial and
  on-road energy demand, and stockpiles — and environmental risk — methane
  emissions via Methane Watch, wildfire risk, forest-carbon and deforestation
  monitoring, and carbon accounting. Kayrros delivers asset-level data feeds,
  APIs, and dashboards to traders, operators, financial institutions,
  regulators, insurers, and the public sector. The company was acquired by
  Energy Aspects in May 2026.
